{% extends "playground_base.html" %}
{% block title %}{{ remove_copy.title }} · Playground{% endblock %}
{% block playground %}
<section class="pg-sheet-panel RosterRemoveDialog" data-roster-remove="{{ law_id }}" role="dialog" aria-modal="true" aria-labelledby="pg-remove-title">
  <p class="pg-eyebrow">{{ short_title }}</p>
  <h1 id="pg-remove-title">{{ remove_copy.title }}</h1>
  <p class="pg-lede">Your progress will be saved.</p>
  <p class="pg-lede">{{ remove_copy.consequence }}</p>
  <form method="post" action="/playground/roster/{{ law_id }}/remove">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <p class="pg-actions">
      <button type="submit" class="pg-btn">{{ remove_copy.title }}</button>
      <a class="pg-btn pg-btn--ghost" href="/playground/roster" data-pg-sheet-close>Cancel</a>
    </p>
  </form>
</section>
{% endblock %}
