<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recall the C — Learn the Constitution of India</title>
<meta name="description" content="Recall the C is an educational platform for learning, recalling and revising the Constitution of India through structured learning methods, visual explanations, progress tracking and spaced repetition.">
<meta property="og:site_name" content="Recall the C">
<meta property="og:title" content="Recall the C — Learn the Constitution of India">
<meta property="og:description" content="Recall the C is an educational platform for learning, recalling and revising the Constitution of India through structured learning methods, visual explanations, progress tracking and spaced repetition.">
<link rel="icon" type="image/png" href="/static/main_logo.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,300;1,9..144,500&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/styles.css?v=main80">
<style>
  /* ── Phone launch ───────────────────────────────────────────────────────
     The desktop landing is a 600vh pinned-scroll corridor: on a phone it is
     the wrong instrument. Below 560px it stands down entirely and this takes
     its place — two doors, Constitution or Laws. Width-driven, every visit;
     there is no "first open" state stored anywhere. */
  .rc-launch{display:none}
  @keyframes rcPop{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
  @keyframes rcRise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @media (max-width:560px){
    .rc-landing-full{display:none}
    .rc-desk{display:none}
    .rc-launch{display:block;position:fixed;inset:0;background:var(--page);color:var(--ink);overflow:hidden}
    .rc-launch-center{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:0 40px 60px;text-align:center}
    .rc-launch-mark{display:inline-flex;align-items:center;justify-content:center;width:64px;height:64px;border:2px solid var(--ink);font-family:"Abril Fatface",Georgia,serif;font-size:32px;font-weight:400;line-height:1;margin-bottom:22px;animation:rcPop .5s ease both}
    .rc-launch-name{margin:0 0 6px;font-family:Fraunces,Georgia,serif;font-size:27px;font-weight:500;animation:rcRise .4s ease .15s both}
    .rc-launch-tag{margin:0;font-size:13.5px;color:var(--muted);animation:rcRise .4s ease .25s both}
    .rc-launch-actions{position:absolute;left:0;right:0;bottom:calc(56px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:9px;padding:0 24px;animation:rcRise .4s ease .5s both}
    .rc-launch-cta{display:flex;align-items:center;justify-content:center;height:52px;border-radius:12px;background:var(--accent);color:var(--on-accent);font-size:15px;font-weight:600}
    .rc-launch-cta:hover,.rc-launch-cta:active{color:var(--on-accent)}
    .rc-launch-cta.is-ghost{height:48px;border:1px solid var(--control-border);background:transparent;color:var(--ink);font-size:14px;font-weight:400}
    .rc-launch-cta.is-ghost:hover,.rc-launch-cta.is-ghost:active{color:var(--ink)}
    .rc-launch-foot{position:absolute;left:0;right:0;bottom:calc(22px + env(safe-area-inset-bottom,0px));margin:0;text-align:center;font-size:11px;letter-spacing:.08em;color:var(--muted)}
  }
  @media (max-width:560px) and (prefers-reduced-motion:reduce){
    .rc-launch-mark,.rc-launch-name,.rc-launch-tag,.rc-launch-actions{animation:none}
  }

  /* After styles.css so later a/a:hover rules win on this page. */
  a{color:inherit;text-decoration:none}
  a:hover{color:var(--accent-hover)}
  html{overflow-x:clip}
  body{margin:0;background:var(--page);color:var(--ink);font-family:"Source Sans 3",system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
  *,*::before,*::after{box-sizing:border-box}

  /* Desktop Screen 1 (CTA map guest/01-screen). Hidden on phone. */
  .rc-desk{display:none}
  @media (min-width:561px){
    html,body{height:100%;overflow:hidden}
    .rc-desk{
      display:flex;align-items:center;justify-content:center;
      position:fixed;inset:0;background:var(--page);color:var(--ink);text-align:center
    }
    .rc-desk-stack{display:flex;flex-direction:column;align-items:center}
    .rc-desk-mark{
      display:inline-flex;align-items:center;justify-content:center;
      width:88px;height:88px;border:1px solid var(--ink);
      font-family:"Abril Fatface",Georgia,serif;font-size:44px;font-weight:400;line-height:1
    }
    .rc-desk-name{
      margin:28px 0 10px;font-family:Fraunces,Georgia,serif;font-size:32px;font-weight:500;line-height:1.15
    }
    .rc-desk-tag{margin:0 0 32px;font-size:14px;color:var(--muted);font-weight:400}
    .rc-desk-actions{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:12px;align-items:center;justify-content:center}
    .rc-desk-cta{
      display:flex;align-items:center;justify-content:center;width:100%;box-sizing:border-box;
      height:40px;padding:0 22px;border-radius:999px;border:1px solid var(--accent);
      background:var(--accent);color:var(--on-accent);font-size:14px;font-weight:600;line-height:1;white-space:nowrap
    }
    .rc-desk-cta:hover,.rc-desk-cta:active{color:var(--on-accent);background:var(--accent-hover);border-color:var(--accent-hover)}
    .rc-desk-cta.is-ghost{
      background:transparent;color:var(--ink);border-color:var(--control-border);font-weight:400
    }
    .rc-desk-cta.is-ghost:hover,.rc-desk-cta.is-ghost:active{color:var(--ink);background:transparent;border-color:var(--ink)}
  }
</style>
</head>
<body>
<section class="rc-desk" data-guest-landing="desktop">
  <div class="rc-desk-stack">
    <span class="rc-desk-mark" aria-hidden="true">C</span>
    <h1 class="rc-desk-name">Recall the C</h1>
    <p class="rc-desk-tag">The Constitution, remembered.</p>
    <div class="rc-desk-actions">
      <a class="rc-desk-cta" href="/browse">Explore the Constitution</a>
      <a class="rc-desk-cta is-ghost" href="/laws">Explore Laws</a>
    </div>
  </div>
</section>

<section class="rc-launch">
  <div class="rc-launch-center">
    <span class="rc-launch-mark" aria-hidden="true">C</span>
    <p class="rc-launch-name">Recall the C</p>
    <p class="rc-launch-tag">The Constitution, remembered.</p>
  </div>
  <div class="rc-launch-actions">
    <a class="rc-launch-cta" href="/browse">Explore the Constitution</a>
    <a class="rc-launch-cta is-ghost" href="/laws">Explore Laws</a>
  </div>
  <p class="rc-launch-foot">BARE ACT · VERBATIM · DAY 1 · 3 · 7 · 15 · 30 · 60</p>
</section>

<p class="visually-hidden">
  <a href="/terms">Terms</a>
  <a href="/privacy">Privacy</a>
</p>

<script src="/static/landing.js?v=landing2" defer></script>
</body>
</html>
