[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "constitution-memorizer"
version = "0.1.0"
description = "PDF-to-JSON extraction pipeline for the Constitution of India Bare Act"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Constitution Memorizer contributors" }]
keywords = ["constitution", "india", "pdf", "docling", "legal-text"]
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "rapidfuzz>=3.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "itsdangerous>=2.1.0",
    "psycopg[binary,pool]>=3.1.0",
    "alembic>=1.13.0",
    "sqlalchemy>=2.0.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.27.0",
]
pdf = [
    "docling>=2.0.0",
]

[tool.setuptools.package-data]
constitution_memorizer = [
    "web/templates/**/*",
    "web/static/**/*",
    "web/explainer_assets/**/*",
    "web/browse_parts.seed.json",
    "web/browse_chapters.seed.json",
    "web/sitemap.xml",
    "web/robots.txt",
]

[project.scripts]
constitution-memorizer = "constitution_memorizer.cli:main"

[project.urls]
Repository = "https://github.com/sanjisworking-commits/memorize_the_c"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." keeps `from tests.quiz_helpers import …` importable under a bare
# `pytest` (CI) — `python -m pytest` adds the repo root to sys.path itself.
pythonpath = ["src", "."]
markers = [
    "integration: tests that require Docling and/or the Bare Act PDF",
]
