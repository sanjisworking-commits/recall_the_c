name: CI

on:
  push:
    branches:
      - main
      - "cursor/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Decide whether to run unit tests
        id: gate
        run: |
          set -euo pipefail
          run=false
          reason="commit count not divisible by 3"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            run=true
            reason="workflow_dispatch"
          fi
          msg="$(git log -1 --format=%B)"
          if printf '%s' "$msg" | grep -Fq '[ci full]'; then
            run=true
            reason="commit message contains [ci full]"
          fi
          count="$(git rev-list --count HEAD)"
          echo "Commit count: ${count}"
          echo "Commit count modulo 3: $((count % 3))"
          if [ "$((count % 3))" -eq 0 ]; then
            run=true
            reason="commit count ${count} % 3 == 0"
          fi
          echo "run=${run}" >> "$GITHUB_OUTPUT"
          echo "count=${count}" >> "$GITHUB_OUTPUT"
          echo "reason=${reason}" >> "$GITHUB_OUTPUT"
          echo "Decision: run=${run} (${reason})"
          if [ "${run}" != "true" ]; then
            echo "Skipping unit tests (${reason}). Job succeeds without running pytest."
          fi

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CI dependencies
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
          pip install -e .

      - name: Run unit tests
        if: steps.gate.outputs.run == 'true'
        run: pytest -m "not integration" -q --tb=short
